---
- name: Cleanup Local
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Remove lab domains from local /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} LAB.NET"
        state: absent
