targetRevision: main
namespace: argocd

projects:
  addons:
    enabled: true
  workspaceLab:
    enabled: true

apps:
  bootstrap:
    spec:
      project: default
      source:
        repoURL: https://github.com/xaistrying/mini-homelab.git
        path: kubernetes/argocd-init
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

  argocd:
    enabled: true
    spec:
      project: default
      source:
        repoURL: https://github.com/xaistrying/mini-homelab.git
        path: kubernetes/argocd-init/argocd
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

  addons:
    enabled: true
    spec:
      project: addons
      source:
        repoURL: https://github.com/xaistrying/mini-homelab.git
        path: kubernetes/argocd-apps/addons
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

  workspaceLab:
    enabled: true
    spec:
      project: workspace-lab
      source:
        repoURL: https://github.com/xaistrying/mini-homelab.git
        path: kubernetes/argocd-apps/workspace-lab
      destination:
        server: https://kubernetes.default.svc
        namespace: lab
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
