# =============================================================================
# PODINFO — Reference Microservice for Observability & Chaos Engineering
# =============================================================================
#
# What is Podinfo?
#   A small Go microservice specifically designed for Kubernetes testing.
#   It exposes /metrics in Prometheus format, includes built-in health checks,
#   and features "fault injection" endpoints—ideal for learning observability,
#   monitoring, and resilience patterns.
#
# Key Endpoints:
#   GET  /              → returns pod info (hostname, version, etc.)
#   GET  /healthz       → health check (use for liveness probe)
#   GET  /readyz        → readiness check (use for readiness probe)
#   GET  /metrics       → prometheus metrics (to be scraped by VMAgent/Prometheus)
#   GET  /delay/{secs}  → simulate slow response (latency) (e.g. /delay/5 → wait 5 seconds)
#   GET  /status/{code} → simulate HTTP error (e.g. /status/500 → return 500)
#   POST /panic         → crash container immediately → test K8s self-healing
#   GET  /env           → returns environment variables
#   POST /store         → simulate data write
#   GET  /store/{hash}  → simulate data read
#
# Metrics exposed by Podinfo (on /metrics):
#   http_request_duration_seconds  → histogram, measures request processing time
#   http_requests_total            → counter, counts total number of requests
#   Both have labels: method, path, status → filter on Grafana
#
# =============================================================================

podinfo:
  # ---------------------------------------------------------------------------
  # Replication Strategy
  # ---------------------------------------------------------------------------
  # Running 2 replicas serves these purposes:
  #   1. Chaos Mesh can kill 1 pod while the service remains available
  #   2. Observing load balancing between 2 pods on Grafana
  #   3. Simulate production scenario (always have more than 2 replicas)
  replicaCount: 2

  # ---------------------------------------------------------------------------
  # Resources
  # ---------------------------------------------------------------------------
  # Podinfo is lightweight (~10MB RAM idle). However, resources will spike 
  # during k6 stress tests or Chaos Mesh CPU-stress experiments.
  #
  # requests = guaranteed resources (K8s scheduler uses this to schedule pod)
  # limits   = maximum resources (exceeding limit → OOMKill or CPU throttle)
  resources:
    requests:
      cpu: 50m        # 50 milliCPU = 5% of 1 core
      memory: 32Mi    # 32 MiB — enough for idle + light traffic
    limits:
      cpu: 200m       # max 20% of 1 core
      memory: 128Mi   # exceeds → OOMKill → pod restart → you'll see on Grafana

  # ---------------------------------------------------------------------------
  # Health checks (Probes)
  # ---------------------------------------------------------------------------
  # Kubernetes continuously checks health of pod via 2 probes:
  #
  # Liveness Probe (/healthz):
  #   Logic: "Is the container stuck?" → If failure is detected → K8s RESTARTS pod.
  #   Testing: Use Chaos Mesh to inject faults here to trigger and monitor restarts.
  #
  # Readiness Probe (/readyz):
  #   Logic: "Is the container ready to receive traffic?" → If failure is detected → K8s removes pod from Service.
  #   Testing: Use Chaos Mesh to inject faults here to trigger and monitor pod removal.
  #
  # When using Chaos Mesh:
  #   - Pod kill → liveness fail → restart → you'll see restart count on Grafana
  #   - Network delay → readiness timeout → pod removed from endpoints
  #     → error rate increases as traffic flows to remaining pod

  # ---------------------------------------------------------------------------
  # Service
  # ---------------------------------------------------------------------------
  # ClusterIP service — only accessible from within the cluster.
  # k6 will call into this service: http://podinfo.lab:9898
  service:
    enabled: true

  # ---------------------------------------------------------------------------
  # Ingress — default off
  # ---------------------------------------------------------------------------
  # Podinfo only needs access from within the cluster.
  # Enable if you want to access from browser.
  ingress:
    enabled: false
